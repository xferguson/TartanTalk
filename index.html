<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6b3b5a" />
    <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Tartan Talk</title>
    <script>
      // Apply a stored theme override before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('tt-theme');
        if (t === 'day') document.documentElement.dataset.theme = 'light';
        if (t === 'night') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
