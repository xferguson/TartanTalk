name: Conflict notifier

# GitHub does not start pull_request workflows for a PR that conflicts with its base,
# so a session waiting on CI would wait forever. When main moves, flag every open PR
# that now conflicts; the comment wakes any session subscribed to the PR.

on:
  push:
    branches: [main]

permissions:
  pull-requests: write
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- conflict-notifier -->';
            const prs = await github.paginate(github.rest.pulls.list, {
              ...context.repo, state: 'open', base: 'main', per_page: 100,
            });
            for (const { number } of prs) {
              // mergeable is computed lazily; poll until GitHub has an answer.
              let pr;
              for (let i = 0; i < 6; i++) {
                ({ data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number }));
                if (pr.mergeable !== null) break;
                await new Promise((r) => setTimeout(r, 5000));
              }
              if (pr.mergeable !== false) continue;
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo, issue_number: number, per_page: 100,
              });
              // One nudge per new main commit is enough; skip if we already flagged this base.
              if (comments.some((c) => c.body.includes(marker) && c.body.includes(context.sha))) continue;
              await github.rest.issues.createComment({
                ...context.repo, issue_number: number,
                body: `${marker}\n**Merge conflict with \`main\`** (now at ${context.sha.slice(0, 7)}). CI will not run until it is resolved: fetch \`origin/main\`, merge it into this branch, resolve, re-run the checks and push.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`,
              });
            }
